<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script src="loginpage.js" defer></script>
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>

   <section>
      
      <form id="login" name="login"  method="get">
         <fieldset>
            <legend>Login</legend>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" class="form-control" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" class="form-control" required>

            
            <input type="submit" id="loginButton" class="btn btn-primary my-2" value="Login" >
         </fieldset>
      </form>
      <div id="displayMessage">
           <p id="errorBox" class="text-danger"> </p>
           <p id="successBox" class="text-success"></p>
      </div>
    
   </section>

 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
