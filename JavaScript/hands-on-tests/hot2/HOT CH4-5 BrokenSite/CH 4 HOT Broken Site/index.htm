<!DOCTYPE html>
<html>
<head>
   <!--

      Author: Justin Thompson

      Filename: index.htm
   -->
   <meta charset="utf-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
   <title>Hands-on Project 7-3</title>
   <link rel="stylesheet" href="styles.css" />
   <script src="modernizr.custom.05819.js"></script>
</head>

<body>
   <header>
      <h1>
         Hands-on Test Chapter 4
      </h1>
   </header>

   <article>
      <h2>Steam Game Sale</h2>
      <form>
         <input type="checkbox" id="item1" value="1999" />
         <label for="item1">Counter Strike ($19.99)</label>
         <input type="checkbox" id="item2" value="2999" />
         <label for="item2">Dark Souls III ($29.99)</label>
         <input type="checkbox" id="item3" value="1349" />
         <label for="item3">Enter The Gungeon ($13.49)</label>
         <input type="checkbox" id="item4" value="499" />
         <label for="item4">Hover Junkers ($4.99)</label>
         <!-- The value of this should be 899 -->
         <input type="checkbox" id="item5" value="899" />
         <label for="item5">Good Robot ($8.99)</label>
         <input type="button" value="Calculate" id="sButton" />
      </form>
      <table>
         <colgroup>
            <col class="label" />
            <col class="amount" />
         </colgroup>
         <tbody>
            <tr>
               <td>Item total</td>
               <td>0.00</td>
            </tr>
            <tr>
               <td>Tax</td>
               <td>0.00</td>
            </tr>
            <tr>
               <td>Total with tax</td>
               <td>$0.00</td>
            </tr>
         </tbody>
      </table>
   </article>
   <script>
	  "use strict";
	  // function to add values of selected check boxes and display total
      function calcTotal() {
         
         var itemTotal = 0;
         var tax = 0;
         var totalWithTax = 0;
         //Items was undeclared 
         var items = document.getElementsByTagName("input");
         var cells = document.getElementsByTagName("td");
         //The for loop should go to 5 and not 3
         for (var i = 0; i < 5; i++) {
            if (items[i].checked) {
               itemTotal += (items[i].value * 1);
            }
         }
         //Tax should be 0.05
         tax = itemTotal * 0.05;
         //Totalwithtax should be itemTotal + tax
         totalWithTax = itemTotal + tax;
         cells[1].innerHTML = (itemTotal / 100).toFixed(2);
         cells[3].innerHTML = (tax / 100).toFixed(2);
         cells[5].innerHTML = "$" + (totalWithTax / 100).toFixed(2);

       //Clear the items checked
       for (let i = 0; i < 5; i++) {
         if (items[i].checked) {
          items[i].checked = false;
          }
       }
      }
      
      // add event listener to Submit button
      var submitButton = document.getElementById("sButton");
      //There should be a a closing quotation after click
      submitButton.addEventListener("click", calcTotal); 
     
      
     
      
      //Adding the Date to the body element
      let date = new Date("Sun Nov 16 2025");
      let divForDate = document.createElement("div");
      divForDate.textContent = date.toDateString();
      document.body.appendChild(divForDate);

   </script>
</body>
</html>
